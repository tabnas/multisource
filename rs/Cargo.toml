[package]
name = "tabnas-multisource"
version = "0.6.2"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Load partial values from multiple external sources into one parse result, as a plugin for the tabnas parsing engine"
repository = "https://github.com/tabnas/multisource"

[lib]
name = "tabnas_multisource"
path = "src/lib.rs"

[dependencies]
# The engine and the directive plugin are consumed as SIBLING CHECKOUTS,
# the standard tabnas development model: clone
# https://github.com/tabnas/parser and https://github.com/tabnas/directive
# next to this repo. Both are on crates.io, but this committed manifest
# names them by path alone, so there is no registry version to fall back
# on; crates-release.yml rewrites the paths into crates.io requirements
# when it publishes this crate. The plugin defines no value grammar and
# ships no JSON reader: it installs on a host grammar the caller builds
# (jsonic, for one), and a caller that loads `.json` sources registers a
# processor for that kind.
tabnas = { package = "tabnas-parser", path = "../../parser/rs" }
tabnas-directive = { path = "../../directive/rs" }
indexmap = "2"
serde_json = { version = "1.0", features = ["preserve_order"] }

[dev-dependencies]
# The host grammar the tests install the plugin on, and the strict-JSON
# reader behind their `json` processor: https://github.com/tabnas/jsonic,
# another sibling checkout, which in turn takes
# https://github.com/tabnas/json the same way.
tabnas-jsonic = { path = "../../jsonic/rs" }
# The shared fixture loader and runner: the Rust half of @tabnas/support,
# another sibling checkout (https://github.com/tabnas/support). The
# `serde_json` feature is the bridge from the engine's `Value::to_json` to
# the runner's fixture value.
tabnas-support = { path = "../../support/rs", features = ["serde_json"] }
# The path-diving plugin, for the composition test only.
tabnas-path = { path = "../../path/rs" }
# The grammar-model plugin, for the dev-only debug view test.
tabnas-debug = { path = "../../debug/rs" }

[package]
name = "tabnas-multisource"
version = "0.5.9"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Load partial values from multiple external sources into one parse result, as a plugin for the tabnas parsing engine"
repository = "https://github.com/tabnas/multisource"

[lib]
name = "tabnas_multisource"
path = "src/lib.rs"

[dependencies]
# The engine, the jsonic base grammar and the directive plugin are
# consumed as SIBLING CHECKOUTS, the standard tabnas development model:
# clone https://github.com/tabnas/parser, https://github.com/tabnas/jsonic
# and https://github.com/tabnas/directive next to this repo. None is
# published, so there is no registry version to fall back on. jsonic in
# turn takes https://github.com/tabnas/json the same way.
tabnas = { path = "../../parser/rs" }
tabnas-jsonic = { path = "../../jsonic/rs" }
tabnas-directive = { path = "../../directive/rs" }
indexmap = "2"
serde_json = { version = "1.0", features = ["preserve_order"] }

[dev-dependencies]
# The shared fixture loader and runner: the Rust half of @tabnas/support,
# another sibling checkout (https://github.com/tabnas/support). The
# `serde_json` feature is the bridge from the engine's `Value::to_json` to
# the runner's fixture value.
tabnas-support = { path = "../../support/rs", features = ["serde_json"] }
# The path-diving plugin, for the composition test only.
tabnas-path = { path = "../../path/rs" }
# The grammar-model plugin, for the dev-only debug view test.
tabnas-debug = { path = "../../debug/rs" }
